<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Written in the Stars</title>
    <style>
        body {
            margin: 0;
            /* This is the key line to display your image */
            background-image: url('photo_2026-05-28-11-24-46.jpg');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;
            color: #f5f6fa; 
            font-family: 'Cinzel', serif;
            display: flex; 
            justify-content: center; 
            align-items: center; 
            min-height: 100vh;
        }

        .container {
            /* This transparency allows the stars to show through */
            background: rgba(18, 27, 45, 0.4); 
            padding: 50px;
            border: 2px solid #dfba6b;
            text-align: center;
            max-width: 500px;
        }

        .hidden { display: none !important; }
    </style>
</head>
<body>

    <div id="proposalScreen" class="container">
        <h1>To Kyal Sin Ko Ko...</h1>
        <p>Among the billions of stars stretching across the night sky, paths crossed, and a beautiful story began. Khun Ye Naung has a question written just for you:</p>
        <h2>WILL YOU MARRY ME?</h2>
        <button onclick="showCert()">YES, ALWAYS</button>
    </div>

    <div id="certScreen" class="container hidden">
        <h1>COSMIC DECREE OF ALLIANCE</h1>
        <p>Khun Ye Naung & Kyal Sin Ko Ko</p>
    </div>

    <script>
        function showCert() {
            document.getElementById('proposalScreen').classList.add('hidden');
            document.getElementById('certScreen').classList.remove('hidden');
        }
    </script>
</body>
</html>
