<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <style>
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; background: #000; }
        
        #stage {
            width: 100vw;
            height: 100vh;
            /* Using your specific PNG file names */
            background-image: url('1000012138.png');
            background-size: contain;
            background-position: center;
            background-repeat: no-repeat;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <div id="stage" onclick="swapImage()"></div>

    <script>
        function swapImage() {
            // Swaps to the second image
            document.getElementById('stage').style.backgroundImage = "url('1000012137.png')";
        }
    </script>
</body>
</html>
