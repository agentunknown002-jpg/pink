<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Written in the Stars</title>
    <style>
        body {
            margin: 0;
            /* Starry Space Gradient */
            background: radial-gradient(circle at center, #1b2735 0%, #090a0f 100%);
            color: #f5f6fa; 
            font-family: 'Cinzel', serif;
            display: flex; 
            justify-content: center; 
            align-items: center; 
            min-height: 100vh;
        }

        .container {
            /* Elegant semi-transparent border box */
            background: rgba(255, 255, 255, 0.05);
            padding: 50px;
            border: 2px solid #dfba6b;
            text-align: center;
            max-width: 500px;
            box-shadow: 0 0 20px rgba(223, 186, 107, 0.2);
        }

        button {
            background: transparent;
            color: #dfba6b;
            border: 1px solid #dfba6b;
            padding: 10px 20px;
            cursor: pointer;
            font-family: 'Cinzel', serif;
            transition: 0.3s;
        }

        button:hover {
            background: #dfba6b;
            color: #090a0f;
        }

        .hidden { display: none !important; }
    </style>
</head>
<body>

    <div id="proposalScreen" class="container">
        <h1>To Kyal Sin Ko Ko...</h1>
        <p>Among the billions of stars stretching across the night sky, paths crossed, and a beautiful story began. Khun Ye Naung has a question written just for you:</p>
        <h2>WILL YOU MARRY ME?</h2>
        <button onclick="showCert()">YES, ALWAYS</button>
    </div>

    <div id="certScreen" class="container hidden">
        <h1>COSMIC DECREE OF ALLIANCE</h1>
        <p>Khun Ye Naung & Kyal Sin Ko Ko</p>
    </div>

    <script>
        function showCert() {
            document.getElementById('proposalScreen').classList.add('hidden');
            document.getElementById('certScreen').classList.remove('hidden');
        }
    </script>
</body>
</html>
