<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Written in the Stars</title>
    <style>
        body {
            margin: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            transition: background 0.5s ease;
            /* Matches your first uploaded PNG */
            background-image: url('1000012138.png');
        }

        .container {
            padding: 50px;
            text-align: center;
            max-width: 600px;
            color: white;
            /* Semi-transparent background for text readability */
            background: rgba(0, 0, 0, 0.3);
            border: 2px solid #dfba6b;
        }

        .hidden { display: none !important; }
    </style>
</head>
<body>

    <div id="proposalScreen" class="container">
        <h1>To Kyal Sin Ko Ko...</h1>
        <p>Among the billions of stars stretching across the night sky, paths crossed, and a beautiful story began. Khun Ye Naung has a question written just for you:</p>
        <h2>WILL YOU MARRY ME?</h2>
        <button onclick="showCert()">YES, ALWAYS</button>
    </div>

    <div id="certScreen" class="container hidden">
        <h1>COSMIC DECREE OF ALLIANCE</h1>
        <p>Khun Ye Naung & Kyal Sin Ko Ko</p>
    </div>

    <script>
        function showCert() {
            document.getElementById('proposalScreen').classList.add('hidden');
            document.getElementById('certScreen').classList.remove('hidden');
            // Changes background to the second PNG on click
            document.body.style.backgroundImage = "url('1000012137.png')";
        }
    </script>
</body>
</html>
