<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Proposal</title>
    <style>
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; }
        
        #stage {
            width: 100vw;
            height: 100vh;
            /* Points to the files in your list */
            background-image: url('proposal.jpg');
            background-size: contain;
            background-position: center;
            background-repeat: no-repeat;
            background-color: black;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <div id="stage" onclick="swapImage()"></div>

    <script>
        function swapImage() {
            // Points to the files in your list
            document.getElementById('stage').style.backgroundImage = "url('certificate.jpg')";
        }
    </script>
</body>
</html>
