<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Written in the Stars</title>
    <style>
        body {
            margin: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            /* Points to renamed proposal.jpg */
            background-image: url('proposal.jpg');
        }

        .container {
            padding: 40px;
            text-align: center;
            max-width: 500px;
            color: white;
            background: rgba(0, 0, 0, 0.3);
            border: 2px solid #dfba6b;
        }

        .hidden { display: none !important; }
    </style>
</head>
<body>

    <div id="proposalScreen" class="container">
        <h1>To Kyal Sin Ko Ko...</h1>
        <p>Among the billions of stars, paths crossed. Khun Ye Naung has a question:</p>
        <h2>WILL YOU MARRY ME?</h2>
        <button onclick="showCert()">YES, ALWAYS</button>
    </div>

    <div id="certScreen" class="container hidden">
        <h1>COSMIC DECREE OF ALLIANCE</h1>
        <p>Khun Ye Naung & Kyal Sin Ko Ko</p>
    </div>

    <script>
        function showCert() {
            document.getElementById('proposalScreen').classList.add('hidden');
            document.getElementById('certScreen').classList.remove('hidden');
            /* Points to renamed certificate.jpg */
            document.body.style.backgroundImage = "url('certificate.jpg')";
        }
    </script>
</body>
</html>
